name: Build Android app
on:
  push:
    branches: [main]
    paths: ["android/**", "app/**", "components/**", "lib/**", "public/**", "package*.json", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (must increase for every Play upload)"
        required: true
        default: "1"
      version_name:
        description: "versionName shown to users"
        required: true
        default: "1.0.0"
permissions: { contents: write }
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      # The app serves the site from its own bundle, so no GitHub Pages base path here.
      - run: npm run build:static
      - run: npx cap sync android
      - name: Build release bundle (unsigned; signed offline before upload) and a debug APK for sideload testing
        working-directory: android
        env:
          # Manual runs set these; pushes use the defaults below. Bump before each Play upload.
          ANDROID_VERSION_CODE: ${{ inputs.version_code || '1' }}
          ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug
          ls -la app/build/outputs/bundle/release app/build/outputs/apk/debug
      - name: Publish the build files to the builds branch
        env:
          VN: ${{ inputs.version_name || '1.0.0' }}
          VC: ${{ inputs.version_code || '1' }}
        run: |
          set -e
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp android/app/build/outputs/bundle/release/app-release.aab "/tmp/pub/silicon-hall-$VN-$VC-unsigned.aab"
          cp android/app/build/outputs/apk/debug/app-debug.apk "/tmp/pub/silicon-hall-$VN-$VC-debug.apk"
          cd /tmp/pub && git init -q -b builds
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Android build $VN ($VC) from $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" builds
      - uses: actions/upload-artifact@v4
        with:
          name: silicon-hall-android-${{ inputs.version_name || '1.0.0' }}-${{ inputs.version_code || '1' }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
